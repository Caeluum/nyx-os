name: Build NyxOS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nyxos-build-main
  cancel-in-progress: true

jobs:
  build:
    name: Build on xiaowin9556_jamanta
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Preparar workspace
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            git curl cpio live-config live-boot debian-archive-keyring \
            debootstrap squashfs-tools xorriso isolinux syslinux-common \
            dosfstools mtools

          LIVE_BUILD_DEB="/tmp/live-build_20250505+deb13u1_all.deb"
          curl --fail --show-error --location \
            --retry 3 \
            -o "$LIVE_BUILD_DEB" \
            "https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb"
          echo "58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  $LIVE_BUILD_DEB" | sha256sum --check
          sudo dpkg -i "$LIVE_BUILD_DEB"
          lb --version

      - name: Limpar builds anteriores
        run: |
          sudo lb clean --purge || true
          rm -rf out

      - name: Configurar live-build
        run: lb config

      - name: Buildar ISO
        run: sudo lb build

      - name: Corrigir permissões do workspace
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Preparar ISO e checksum
        run: |
          set -eu
          mkdir -p out

          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "::error::Nenhuma ISO foi gerada"
            exit 1
          fi

          OUTPUT="out/nyxos-$(date +%Y%m%d)-amd64.iso"
          cp "$ISO" "$OUTPUT"
          sha256sum "$OUTPUT" > "${OUTPUT}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyxos-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 90

      - name: Upload GoFile
        run: |
          set -eu

          ISO="$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "::error::Nenhuma ISO encontrada para upload"
            exit 1
          fi

          curl --fail --show-error --location \
            --retry 3 \
            -F "file=@${ISO}" \
            https://upload.gofile.io/uploadfile
