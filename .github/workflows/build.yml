name: Build NyxOS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Instalar dependências básicas
        run: |
          apt-get update
          apt-get install -y git sudo

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar live-build e ferramentas
        run: |
          apt-get install -y live-build live-config live-boot \
            debootstrap squashfs-tools xorriso isolinux syslinux-common \
            dosfstools mtools

      - name: Limpar builds anteriores
        run: lb clean --purge || true

      - name: Configurar live-build
        run: lb config

      - name: Buildar ISO
        run: lb build

      - name: Preparar ISO e checksum
        run: |
          set -eu
          mkdir -p out
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "::error::Nenhuma ISO foi gerada"
            exit 1
          fi

          OUTPUT="out/nyxos-$(date +%Y%m%d)-amd64.iso"
          cp "$ISO" "$OUTPUT"
          sha256sum "$OUTPUT" > "${OUTPUT}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyxos-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 90

      - name: Upload GoFile
        run: |
          set -eu
          apt-get update
          apt-get install -y curl

          ISO="$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "::error::Nenhuma ISO encontrada para upload"
            exit 1
          fi

          curl --fail --show-error --location \
            --retry 3 \
            -F "file=@${ISO}" \
            https://upload.gofile.io/uploadfile
